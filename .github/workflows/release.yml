name: Release

# REQ-OAUTH-RELEASE: each v* tag publishes the built package (npm pack, dist/ included) as a release asset.
# Products install that tarball URL, so no install script runs (pnpm 11 refuses a git dependency's `prepare`).
# workflow_dispatch publishes a tag pushed before this workflow existed.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (for example v0.1.0)'
        required: true

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      # The release script comes from this workflow's commit; the package from the tag (an older tag may predate the
      # script).
      - uses: actions/checkout@v7
        with:
          path: tool
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          path: package
      - uses: actions/setup-node@v7
        with:
          node-version-file: package/.nvmrc
      - run: npm ci
        working-directory: package
      - run: npm test
        working-directory: package
      - name: Pack and attach the tarball
        working-directory: package
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: node ../tool/scripts/release.ts "$TAG"
